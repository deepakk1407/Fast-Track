<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FAST-TRACK | Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(59, 130, 246, 0.28),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139, 92, 246, 0.24),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #07111f,
                    #0b1730,
                    #111827
                );

            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            width: 245px;

            padding: 22px 15px;

            background:
                rgba(8, 18, 35, 0.88);

            backdrop-filter: blur(18px);

            border-right:
                1px solid rgba(255,255,255,0.08);

            box-shadow:
                10px 0 40px rgba(0,0,0,0.18);

            z-index: 100;
        }


        .sidebar-brand {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 5px 10px 28px;

            font-size: 19px;

            font-weight: 800;

            color: #ffffff;
        }


        .sidebar-brand img {

            width: 40px;
            height: 40px;

            object-fit: contain;

            flex-shrink: 0;
        }


        .sidebar-brand span {
            white-space: nowrap;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav-menu {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .nav-item {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 13px;

            border: 1px solid transparent;

            border-radius: 11px;

            background: transparent;

            color: #94a3b8;

            font-size: 13px;

            font-weight: 600;

            text-align: left;

            cursor: pointer;

            transition: 0.25s;
        }


        .nav-item:hover {

            color: #ffffff;

            background:
                rgba(59,130,246,0.13);

            border-color:
                rgba(96,165,250,0.15);
        }


        .nav-item.active {

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    rgba(37,99,235,0.85),
                    rgba(124,58,237,0.85)
                );

            box-shadow:
                0 8px 25px
                rgba(37,99,235,0.25);
        }


        .nav-icon {

            width: 22px;

            text-align: center;

            font-size: 17px;

            flex-shrink: 0;
        }


        /* =========================
           MAIN
        ========================= */

        .main {

            margin-left: 245px;

            min-height: 100vh;
        }


        /* =========================
           TOPBAR
        ========================= */

        .topbar {

            height: 72px;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            padding: 0 30px;

            background:
                rgba(7,17,31,0.65);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }


        .user-area {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        #userName {

            font-size: 13px;

            font-weight: 700;

            color: #e2e8f0;
        }


        #logoutButton {

            border:
                1px solid rgba(255,255,255,0.12);

            padding: 9px 17px;

            border-radius: 9px;

            background:
                rgba(239,68,68,0.15);

            color: #fca5a5;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        #logoutButton:hover {

            background: #ef4444;

            color: white;
        }


        /* =========================
           DASHBOARD CONTENT
        ========================= */

        .dashboard {

            padding: 42px;
        }


        .welcome {

            margin-bottom: 32px;
        }


        .welcome h1 {

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 9px;

            color: #ffffff;
        }


        .welcome h1 span {

            background:
                linear-gradient(
                    90deg,
                    #60a5fa,
                    #a78bfa
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .welcome p {

            color: #94a3b8;

            font-size: 14px;
        }


        /* =========================
           CARDS
        ========================= */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }


        .card {

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.10),
                    rgba(255,255,255,0.04)
                );

            backdrop-filter: blur(15px);

            padding: 26px;

            min-height: 170px;

            border-radius: 18px;

            border:
                1px solid rgba(255,255,255,0.10);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.20);

            transition: 0.3s;

            cursor: pointer;
        }


        .card::before {

            content: "";

            position: absolute;

            width: 100px;
            height: 100px;

            top: -50px;
            right: -40px;

            background:
                rgba(59,130,246,0.18);

            border-radius: 50%;

            filter: blur(5px);
        }


        .card:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(96,165,250,0.30);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.30);
        }


        .card-icon {

            font-size: 30px;

            margin-bottom: 18px;
        }


        .card h3 {

            font-size: 17px;

            margin-bottom: 8px;

            color: #ffffff;
        }


        .card p {

            color: #94a3b8;

            font-size: 12px;

            line-height: 1.6;
        }


        /* =========================
           TABLET
        ========================= */

        @media (max-width: 1000px) {

            .cards {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        /* =========================
           TABLET / SMALL LAPTOP
        ========================= */

        @media (max-width: 800px) {

            .sidebar {

                width: 70px;

                padding: 18px 8px;
            }


            .sidebar-brand {

                justify-content: center;

                padding: 5px 0 25px;
            }


            .sidebar-brand span {

                display: none;
            }


            .nav-item {

                justify-content: center;

                padding: 12px 5px;
            }


            .nav-item span:not(.nav-icon) {

                display: none;
            }


            .nav-icon {

                font-size: 19px;
            }


            .main {

                margin-left: 70px;
            }


            .topbar {

                padding: 0 15px;
            }


            .dashboard {

                padding: 28px 18px;
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {

                min-width: 0;

                overflow-x: hidden;
            }


            /* =====================
               MOBILE TOP BRAND
            ===================== */

            .sidebar {

                position: fixed;

                top: 0;
                left: 0;

                bottom: auto;

                width: 100%;

                height: 62px;

                padding: 0 14px;

                display: flex;

                align-items: center;

                background:
                    rgba(7,17,31,0.96);

                backdrop-filter: blur(20px);

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(255,255,255,0.10);

                box-shadow:
                    0 5px 25px
                    rgba(0,0,0,0.20);

                z-index: 200;
            }


            .sidebar-brand {

                display: flex;

                align-items: center;

                justify-content: flex-start;

                gap: 9px;

                width: auto;

                padding: 0;

                font-size: 17px;
            }


            .sidebar-brand img {

                width: 38px;
                height: 38px;

                display: block;
            }


            .sidebar-brand span {

                display: block;

                color: #ffffff;

                font-size: 17px;

                font-weight: 800;

                letter-spacing: 0.5px;

                white-space: nowrap;
            }


            /* =====================
               MOBILE NAV
            ===================== */

            .nav-menu {

                position: fixed;

                left: 0;
                bottom: 0;

                width: 100%;

                height: 68px;

                padding: 5px 4px;

                display: flex;

                flex-direction: row;

                justify-content: space-around;

                align-items: center;

                gap: 0;

                background:
                    rgba(5,13,26,0.97);

                backdrop-filter: blur(20px);

                border-top:
                    1px solid
                    rgba(255,255,255,0.10);

                z-index: 300;
            }


            .nav-item {

                flex: 1;

                width: auto;

                height: 58px;

                display: flex;

                flex-direction: column;

                align-items: center;

                justify-content: center;

                gap: 3px;

                padding: 4px 2px;

                border-radius: 9px;

                font-size: 8px;

                text-align: center;
            }


            .nav-item span:not(.nav-icon) {

                display: block;

                white-space: nowrap;
            }


            .nav-icon {

                width: auto;

                font-size: 17px;
            }


            /* =====================
               MOBILE MAIN
            ===================== */

            .main {

                margin-left: 0;

                width: 100%;

                min-height: 100vh;

                padding-top: 62px;

                padding-bottom: 78px;
            }


            /* =====================
               MOBILE TOPBAR
            ===================== */

            .topbar {

                height: 55px;

                padding: 0 14px;

                display: flex;

                justify-content: flex-end;

                align-items: center;

                background:
                    rgba(7,17,31,0.70);

                backdrop-filter: blur(15px);

                border-bottom:
                    1px solid
                    rgba(255,255,255,0.06);
            }


            .user-area {

                gap: 0;
            }


            #userName {

                display: none;
            }


            #logoutButton {

                padding: 8px 13px;

                font-size: 11px;

                border-radius: 8px;
            }


            /* =====================
               MOBILE DASHBOARD
            ===================== */

            .dashboard {

                width: 100%;

                padding: 24px 14px 30px;
            }


            .welcome {

                margin-bottom: 24px;
            }


            .welcome h1 {

                font-size: 24px;

                line-height: 1.3;

                margin-bottom: 7px;
            }


            .welcome p {

                font-size: 12px;

                line-height: 1.5;
            }


            /* =====================
               MOBILE CARDS
            ===================== */

            .cards {

                width: 100%;

                grid-template-columns: 1fr;

                gap: 14px;
            }


            .card {

                width: 100%;

                min-height: 140px;

                padding: 20px;

                border-radius: 16px;
            }


            .card-icon {

                font-size: 27px;

                margin-bottom: 13px;
            }


            .card h3 {

                font-size: 16px;

                margin-bottom: 7px;
            }


            .card p {

                font-size: 11px;

                line-height: 1.6;
            }

        }


        /* =========================
           VERY SMALL PHONES
        ========================= */

        @media (max-width: 360px) {

            .sidebar {

                height: 59px;

                padding: 0 11px;
            }


            .sidebar-brand img {

                width: 35px;
                height: 35px;
            }


            .sidebar-brand span {

                font-size: 15px;
            }


            .main {

                padding-top: 59px;

                padding-bottom: 76px;
            }


            .topbar {

                height: 52px;

                padding: 0 11px;
            }


            #logoutButton {

                padding: 7px 11px;

                font-size: 10px;
            }


            .dashboard {

                padding: 21px 12px 25px;
            }


            .welcome h1 {

                font-size: 21px;
            }


            .welcome p {

                font-size: 11px;
            }


            .nav-menu {

                height: 66px;
            }


            .nav-item {

                height: 56px;

                font-size: 7px;
            }


            .nav-icon {

                font-size: 16px;
            }


            .card {

                min-height: 135px;

                padding: 18px;
            }

        }

    </style>

</head>

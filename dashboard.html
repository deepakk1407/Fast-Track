<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Inter", Arial, sans-serif;
    color: #172033;
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(59, 130, 246, 0.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 85%,
            rgba(124, 58, 237, 0.08),
            transparent 30%
        ),
        #f3f6fb;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    width: 245px;

    padding: 22px 15px;

    background:
        rgba(255, 255, 255, 0.94);

    backdrop-filter: blur(18px);

    border-right:
        1px solid #dfe7f2;

    box-shadow:
        8px 0 35px
        rgba(30, 64, 175, 0.07);

    z-index: 100;
}


/* =========================
   SIDEBAR BRAND
========================= */

.sidebar-brand {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 5px 10px 28px;

    font-size: 19px;

    font-weight: 800;

    color: #172554;
}


.sidebar-brand img {
    width: 40px;
    height: 40px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 5px 10px
            rgba(37, 99, 235, 0.12)
        );
}


/* =========================
   NAVIGATION
========================= */

.nav-menu {
    display: flex;

    flex-direction: column;

    gap: 7px;
}


.nav-item {
    display: flex;

    align-items: center;

    gap: 12px;

    width: 100%;

    padding: 13px;

    border: 1px solid transparent;

    border-radius: 11px;

    background: transparent;

    color: #64748b;

    font-size: 13px;

    font-weight: 600;

    text-align: left;

    cursor: pointer;

    transition: 0.25s;
}


.nav-item:hover {
    color: #2563eb;

    background:
        #eff6ff;

    border-color:
        #dbeafe;
}


.nav-item.active {
    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 8px 22px
        rgba(37, 99, 235, 0.18);
}


.nav-icon {
    width: 22px;

    text-align: center;

    font-size: 17px;
}


/* =========================
   MAIN
========================= */

.main {
    margin-left: 245px;

    min-height: 100vh;
}


/* =========================
   TOPBAR
========================= */

.topbar {
    height: 72px;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    padding: 0 30px;

    background:
        rgba(255, 255, 255, 0.88);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid #e2e8f0;

    box-shadow:
        0 5px 25px
        rgba(30, 64, 175, 0.04);
}


.user-area {
    display: flex;

    align-items: center;

    gap: 15px;
}


#userName {
    font-size: 13px;

    font-weight: 700;

    color: #334155;
}


#logoutButton {
    border:
        1px solid #fecaca;

    padding: 9px 17px;

    border-radius: 9px;

    background:
        #fff5f5;

    color: #dc2626;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}


#logoutButton:hover {
    background: #ef4444;

    color: #ffffff;

    border-color: #ef4444;
}


/* =========================
   DASHBOARD CONTENT
========================= */

.dashboard {
    padding: 42px;
}


.welcome {
    margin-bottom: 32px;
}


.welcome h1 {
    font-size: 32px;

    font-weight: 800;

    margin-bottom: 9px;

    color: #172033;
}


.welcome h1 span {
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


.welcome p {
    color: #64748b;

    font-size: 14px;
}


/* =========================
   CARDS
========================= */

.cards {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;
}


.card {
    position: relative;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.98),
            rgba(248,250,255,0.96)
        );

    padding: 26px;

    min-height: 170px;

    border-radius: 18px;

    border:
        1px solid #e1e8f2;

    box-shadow:
        0 12px 35px
        rgba(30, 64, 175, 0.08);

    transition: 0.3s;

    cursor: pointer;
}


.card::before {
    content: "";

    position: absolute;

    width: 120px;
    height: 120px;

    top: -60px;
    right: -45px;

    background:
        rgba(59,130,246,0.08);

    border-radius: 50%;

    filter: blur(4px);
}


.card::after {
    content: "";

    position: absolute;

    width: 80px;
    height: 80px;

    left: -40px;
    bottom: -40px;

    background:
        rgba(124,58,237,0.05);

    border-radius: 50%;
}


.card:hover {
    transform:
        translateY(-5px);

    border-color:
        #c7d9f7;

    box-shadow:
        0 20px 45px
        rgba(30, 64, 175, 0.13);
}


.card-icon {
    font-size: 30px;

    margin-bottom: 18px;

    position: relative;

    z-index: 2;
}


.card h3 {
    font-size: 17px;

    margin-bottom: 8px;

    color: #172033;

    position: relative;

    z-index: 2;
}


.card p {
    color: #64748b;

    font-size: 12px;

    line-height: 1.6;

    position: relative;

    z-index: 2;
}


/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .cards {
        grid-template-columns:
            repeat(2, 1fr);
    }
}


/* =========================
   TABLET / SMALL LAPTOP
========================= */

@media (max-width: 800px) {

    .sidebar {
        width: 70px;

        padding: 18px 8px;
    }


    .sidebar-brand {
        justify-content: center;

        padding: 5px 0 25px;
    }


    .sidebar-brand span {
        display: none;
    }


    .nav-item {
        justify-content: center;

        padding: 12px 5px;
    }


    .nav-item span:not(.nav-icon) {
        display: none;
    }


    .nav-icon {
        font-size: 19px;
    }


    .main {
        margin-left: 70px;
    }


    .topbar {
        padding: 0 15px;
    }


    .dashboard {
        padding: 28px 18px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .sidebar {
        position: fixed;

        top: auto;
        bottom: 0;
        left: 0;

        width: 100%;

        height: 68px;

        padding: 5px 4px;

        border-right: none;

        border-top:
            1px solid #dfe7f2;

        background:
            rgba(255,255,255,0.96);

        backdrop-filter: blur(20px);

        box-shadow:
            0 -8px 25px
            rgba(30,64,175,0.08);
    }


    .sidebar-brand {
        display: none;
    }


    .nav-menu {
        height: 100%;

        flex-direction: row;

        justify-content:
            space-around;

        align-items: center;

        gap: 0;
    }


    .nav-item {
        flex: 1;

        height: 58px;

        flex-direction: column;

        justify-content: center;

        gap: 3px;

        padding: 4px 2px;

        border-radius: 9px;

        font-size: 8px;
    }


    .nav-item span:not(.nav-icon) {
        display: block;
    }


    .nav-item.active {
        box-shadow: none;
    }


    .nav-icon {
        font-size: 17px;
    }


    .main {
        margin-left: 0;

        padding-bottom: 75px;
    }


    .topbar {
        height: 62px;

        background:
            rgba(255,255,255,0.92);
    }


    #userName {
        display: none;
    }


    .dashboard {
        padding: 25px 14px;
    }


    .welcome h1 {
        font-size: 24px;
    }


    .welcome p {
        font-size: 12px;
    }


    .cards {
        grid-template-columns: 1fr;

        gap: 14px;
    }


    .card {
        min-height: 145px;

        padding: 21px;

        border-radius: 16px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .dashboard {
        padding:
            22px 12px;
    }


    .welcome h1 {
        font-size: 22px;
    }


    .card {
        padding: 19px;

        min-height: 140px;
    }


    .card h3 {
        font-size: 16px;
    }

}

</style>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FAST-TRACK | Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            background: white;

            box-shadow:
                0 2px 12px rgba(0,0,0,0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 800;

            color: #2563eb;
        }

        .brand img {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #userName {
            font-weight: 600;
            color: #334155;
        }

        #logoutButton {
            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .dashboard {
            padding: 40px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #64748b;
        }

        .cards {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px rgba(15,23,42,0.07);
        }

        .card h3 {
            margin-bottom: 8px;
        }

        .card p {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 800px) {

            .navbar {
                padding: 0 15px;
            }

            .dashboard {
                padding: 25px 15px;
            }

            .welcome h1 {
                font-size: 25px;
            }

            .cards {
                grid-template-columns: 1fr 1fr;
            }

        }

        @media (max-width: 500px) {

            .brand {
                font-size: 17px;
            }

            .brand img {
                width: 35px;
                height: 35px;
            }

            #userName {
                display: none;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="brand">

            <img src="fast-track-logo.png"
                 alt="FAST-TRACK">

            FAST-TRACK

        </div>

        <div class="user-area">

            <span id="userName">
                Loading...
            </span>

            <button id="logoutButton">
                Logout
            </button>

        </div>

    </nav>


    <main class="dashboard">

        <div class="welcome">

            <h1>
                Welcome, <span id="welcomeName">User</span> 👋
            </h1>

            <p>
                Your career journey starts here.
            </p>

        </div>


        <div class="cards">

            <div class="card">
                <h3>💼 Jobs</h3>
                <p>
                    Discover career opportunities.
                </p>
            </div>

            <div class="card">
                <h3>🎯 Skills</h3>
                <p>
                    Track and improve your skills.
                </p>
            </div>

            <div class="card">
                <h3>📄 Resume</h3>
                <p>
                    Build your professional resume.
                </p>
            </div>

            <div class="card">
                <h3>📈 Career Progress</h3>
                <p>
                    Monitor your career growth.
                </p>
            </div>

        </div>

    </main>


    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyDJ84_tSgau334V60r17bqHHubaf5Lecto",

            authDomain:
                "fast-track-6d262.firebaseapp.com",

            projectId:
                "fast-track-6d262",

            storageBucket:
                "fast-track-6d262.firebasestorage.app",

            messagingSenderId:
                "338934873510",

            appId:
                "1:338934873510:web:1ad3791207107af183a367",

            measurementId:
                "G-M6FSRH2Y9H"
        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const userName =
            document.getElementById("userName");

        const welcomeName =
            document.getElementById("welcomeName");


        onAuthStateChanged(
            auth,
            (user) => {

                if (user) {

                    const name =
                        user.displayName ||
                        user.email.split("@")[0];

                    userName.textContent =
                        name;

                    welcomeName.textContent =
                        name;

                } else {

                    window.location.href =
                        "index.html";

                }

            }
        );


        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                async () => {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                }
            );

    </script>

</body>

</html>

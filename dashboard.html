<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAST-TRACK | Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #0f172a;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* =====================================================
           APP
        ===================================================== */

        .app {
            min-height: 100vh;
        }

        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            width: 250px;
            min-height: 100vh;

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            padding: 25px 16px;

            display: flex;
            flex-direction: column;

            color: white;

            background:
                linear-gradient(
                    180deg,
                    #0f172a 0%,
                    #172554 55%,
                    #1e1b4b 100%
                );

            z-index: 1000;

            transition: transform 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 0 10px;
            margin-bottom: 35px;
        }

        .brand img {
            width: 42px;
            height: 42px;

            object-fit: contain;
            border-radius: 10px;
        }

        .brand-text h2 {
            font-size: 18px;
            letter-spacing: 1px;
        }

        .brand-text span {
            display: block;

            margin-top: 3px;

            font-size: 9px;
            color: #93c5fd;

            letter-spacing: 1px;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        .nav-title {
            padding: 0 12px;
            margin-bottom: 10px;

            color: #94a3b8;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.5px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 13px;

            padding: 12px 14px;

            border-radius: 10px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 14px;

            transition: 0.25s ease;
        }

        .nav-item:hover {
            color: white;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-item.active {
            color: white;

            background: rgba(96, 165, 250, 0.18);

            box-shadow:
                inset 3px 0 0 #60a5fa;
        }

        .nav-icon {
            width: 22px;

            text-align: center;

            font-size: 17px;
        }

        /* =====================================================
           SIDEBAR BOTTOM
        ===================================================== */

        .sidebar-bottom {
            margin-top: auto;
        }

        .career-mini {
            padding: 16px;

            margin: 10px 4px 18px;

            border-radius: 14px;

            background: rgba(255, 255, 255, 0.07);

            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .career-mini p {
            margin-bottom: 8px;

            color: #94a3b8;

            font-size: 11px;
        }

        .career-mini strong {
            font-size: 13px;
        }

        .logout-btn {
            width: 100%;

            border: none;

            padding: 12px;

            border-radius: 10px;

            background: rgba(239, 68, 68, 0.1);

            color: #fca5a5;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .logout-btn:hover {
            color: white;
            background: #ef4444;
        }

        /* =====================================================
           MOBILE HEADER
        ===================================================== */

        .mobile-header {
            display: none;
        }

        .menu-btn {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid #e2e8f0;

            border-radius: 11px;

            background: white;

            color: #0f172a;

            font-size: 22px;

            cursor: pointer;
        }

        .mobile-brand {
            display: flex;
            align-items: center;

            gap: 9px;
        }

        .mobile-brand img {
            width: 35px;
            height: 35px;

            object-fit: contain;
        }

        .mobile-brand strong {
            font-size: 16px;
        }

        /* =====================================================
           SIDEBAR OVERLAY
        ===================================================== */

        .sidebar-overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(15, 23, 42, 0.55);

            backdrop-filter: blur(3px);

            z-index: 900;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            width: calc(100% - 250px);

            margin-left: 250px;

            min-height: 100vh;

            padding: 25px 35px;
        }

        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 30px;
        }

        .page-title h1 {
            margin-bottom: 6px;

            font-size: 28px;
        }

        .page-title p {
            color: #64748b;
            font-size: 14px;
        }

        .profile-mini {
            display: flex;
            align-items: center;

            gap: 12px;

            padding: 8px 13px;

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 12px;
        }

        .profile-avatar {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #dbeafe;

            color: #2563eb;

            font-weight: 800;
        }

        .profile-mini strong {
            display: block;

            font-size: 13px;
        }

        .profile-mini span {
            display: block;

            margin-top: 2px;

            color: #64748b;

            font-size: 10px;
        }

        /* =====================================================
           WELCOME CARD
        ===================================================== */

        .welcome-card {
            position: relative;

            overflow: hidden;

            padding: 32px;

            margin-bottom: 25px;

            border-radius: 22px;

            color: white;

            background:
                linear-gradient(
                    120deg,
                    #0f172a,
                    #1d4ed8,
                    #312e81
                );

            box-shadow:
                0 18px 45px rgba(30, 64, 175, 0.18);
        }

        .welcome-card::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -70px;
            top: -80px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.06);
        }

        .welcome-badge {
            position: relative;
            z-index: 2;

            display: inline-block;

            padding: 7px 12px;

            margin-bottom: 15px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.12);

            font-size: 10px;

            letter-spacing: 1px;
        }

        .welcome-card h2 {
            position: relative;
            z-index: 2;

            margin-bottom: 8px;

            font-size: 30px;
        }

        .welcome-card h2 span {
            color: #93c5fd;
        }

        .welcome-card p {
            position: relative;
            z-index: 2;

            max-width: 700px;

            color: #dbeafe;

            font-size: 14px;

            line-height: 1.7;
        }

        /* =====================================================
           STATS
        ===================================================== */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            padding: 22px;

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 16px;

            transition: 0.25s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(15, 23, 42, 0.07);
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .stat-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: #eff6ff;

            font-size: 19px;
        }

        .stat-card small {
            color: #64748b;

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }

        .stat-card h3 {
            margin-top: 5px;

            font-size: 25px;
        }

        /* =====================================================
           CONTENT GRID
        ===================================================== */

        .content-grid {
            display: grid;

            grid-template-columns:
                1.5fr 1fr;

            gap: 20px;
        }

        .panel {
            padding: 24px;

            background: white;

            border: 1px solid #e2e8f0;

            border-radius: 18px;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 20px;
        }

        .panel-header h2 {
            font-size: 17px;
        }

        .panel-header span {
            color: #2563eb;

            font-size: 11px;

            font-weight: 700;
        }

        /* =====================================================
           FEATURES
        ===================================================== */

        .feature-list {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;
        }

        .feature {
            display: block;

            padding: 18px;

            border: 1px solid #e2e8f0;

            border-radius: 13px;

            color: inherit;

            text-decoration: none;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .feature:hover {
            border-color: #93c5fd;

            background: #f8fbff;

            transform: translateY(-2px);
        }

        .feature-icon {
            margin-bottom: 10px;

            font-size: 23px;
        }

        .feature h3 {
            margin-bottom: 5px;

            font-size: 14px;
        }

        .feature p {
            color: #64748b;

            font-size: 11px;

            line-height: 1.5;
        }

        /* =====================================================
           PROFILE INFO
        ===================================================== */

        .profile-info {
            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .info-row {
            padding: 13px;

            border-radius: 10px;

            background: #f8fafc;

            border: 1px solid #eef2f7;
        }

        .info-row small {
            display: block;

            margin-bottom: 5px;

            color: #64748b;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;
        }

        .info-row strong {
            display: block;

            font-size: 13px;

            word-break: break-word;
        }

        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 950px) {

            .sidebar {
                width: 220px;
            }

            .main {
                width: calc(100% - 220px);

                margin-left: 220px;

                padding: 25px;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {
                background: #f5f7fb;
            }

            .sidebar {
                width: 280px;

                transform: translateX(-100%);

                box-shadow:
                    10px 0 35px rgba(15, 23, 42, 0.2);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .main {
                width: 100%;

                margin-left: 0;

                padding: 16px;
            }

            .mobile-header {
                display: flex;

                align-items: center;
                justify-content: space-between;

                margin-bottom: 20px;
            }

            .topbar {
                margin-bottom: 20px;
            }

            .profile-mini {
                display: none;
            }

            .page-title h1 {
                font-size: 24px;
            }

            .page-title p {
                font-size: 12px;
            }

            .welcome-card {
                padding: 25px 20px;

                border-radius: 18px;
            }

            .welcome-card h2 {
                font-size: 25px;
            }

            .welcome-card p {
                font-size: 13px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .feature-list {
                grid-template-columns: 1fr;
            }

            .panel {
                padding: 20px;
            }
        }

        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {

            .main {
                padding: 12px;
            }

            .sidebar {
                width: 270px;
            }

            .mobile-brand strong {
                font-size: 15px;
            }

            .welcome-card {
                padding: 22px 17px;
            }

            .welcome-card h2 {
                font-size: 23px;
            }

            .welcome-card p {
                font-size: 12px;
            }

            .panel {
                padding: 17px;
            }
        }
    </style>
</head>

        <header class="topbar">

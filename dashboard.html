<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST-TRACK | Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --dark:#0f172a;
    --dark2:#172554;
    --text:#0f172a;
    --muted:#64748b;
    --light:#f8fafc;
    --border:#e2e8f0;
    --white:#ffffff;
    --success:#16a34a;
    --warning:#d97706;
    --danger:#dc2626;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:var(--text);
    overflow-x:hidden;
}

button,
a{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:255px;
    padding:22px 15px;
    background:linear-gradient(180deg,#0f172a,#172554 55%,#1e1b4b);
    color:white;
    display:flex;
    flex-direction:column;
    z-index:1000;
    overflow-y:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    padding:4px 10px 25px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.brand img{
    width:43px;
    height:43px;
    object-fit:contain;
    border-radius:11px;
}

.brand h2{
    font-size:18px;
    letter-spacing:1px;
}

.brand span{
    display:block;
    color:#93c5fd;
    font-size:8px;
    letter-spacing:1px;
    margin-top:4px;
}

.nav-title{
    color:#94a3b8;
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    padding:25px 12px 10px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 13px;
    color:#cbd5e1;
    text-decoration:none;
    border-radius:11px;
    font-size:13px;
    transition:.2s ease;
}

.nav-item:hover{
    background:rgba(255,255,255,.08);
    color:white;
    transform:translateX(2px);
}

.nav-item.active{
    background:rgba(96,165,250,.17);
    color:white;
    box-shadow:inset 3px 0 #60a5fa;
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:17px;
}

.sidebar-bottom{
    margin-top:auto;
}

.career-mini{
    margin:18px 3px;
    padding:15px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    background:rgba(255,255,255,.06);
}

.career-mini small{
    display:block;
    color:#94a3b8;
    font-size:9px;
    letter-spacing:1px;
    margin-bottom:8px;
}

.career-mini strong{
    font-size:12px;
}

.logout-btn{
    width:100%;
    padding:11px;
    border:0;
    border-radius:10px;
    background:rgba(239,68,68,.1);
    color:#fca5a5;
    font-weight:700;
    transition:.2s;
}

.logout-btn:hover{
    background:#ef4444;
    color:white;
}

/* =========================
   MAIN
========================= */

.main{
    width:calc(100% - 255px);
    margin-left:255px;
    padding:26px 32px 40px;
    min-height:100vh;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}

.page-title h1{
    font-size:27px;
    margin-bottom:5px;
}

.page-title p{
    color:var(--muted);
    font-size:13px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.notification{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:11px;
    background:white;
    position:relative;
    font-size:17px;
}

.notification-dot{
    position:absolute;
    right:8px;
    top:7px;
    width:7px;
    height:7px;
    background:#ef4444;
    border-radius:50%;
    border:2px solid white;
}

.profile-mini{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 12px 6px 7px;
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
}

.profile-avatar{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#dbeafe;
    color:#2563eb;
    border-radius:50%;
    font-size:13px;
    font-weight:800;
}

.profile-mini strong{
    display:block;
    font-size:12px;
}

.profile-mini span{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-top:2px;
}

/* =========================
   MOBILE HEADER
========================= */

.mobile-header{
    display:none;
}

/* =========================
   WELCOME
========================= */

.welcome-card{
    position:relative;
    overflow:hidden;
    padding:30px;
    border-radius:22px;
    color:white;
    background:linear-gradient(120deg,#0f172a,#1d4ed8,#312e81);
    box-shadow:0 16px 40px rgba(37,99,235,.16);
    margin-bottom:22px;
}

.welcome-card:before,
.welcome-card:after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.06);
}

.welcome-card:before{
    width:240px;
    height:240px;
    right:-90px;
    top:-100px;
}

.welcome-card:after{
    width:150px;
    height:150px;
    right:180px;
    bottom:-100px;
}

.welcome-content{
    position:relative;
    z-index:2;
}

.welcome-badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:30px;
    background:rgba(255,255,255,.12);
    font-size:9px;
    letter-spacing:1px;
    margin-bottom:14px;
}

.welcome-card h2{
    font-size:29px;
    margin-bottom:8px;
}

.welcome-card h2 span{
    color:#93c5fd;
}

.welcome-card p{
    max-width:680px;
    color:#dbeafe;
    line-height:1.65;
    font-size:13px;
}

/* =========================
   OVERVIEW CARDS
========================= */

.overview{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.overview-card{
    background:white;
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    transition:.2s;
}

.overview-card:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 28px rgba(15,23,42,.06);
}

.overview-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.overview-icon{
    width:40px;
    height:40px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eff6ff;
    font-size:18px;
}

.overview-card small{
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
}

.overview-card h3{
    font-size:23px;
}

.overview-card p{
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

/* =========================
   MAIN GRID
========================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.35fr .85fr;
    gap:20px;
}

.left-column,
.right-column{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* =========================
   PANEL
========================= */

.panel{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    min-width:0;
}

.panel-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.panel-header h2{
    font-size:16px;
}

.panel-header span{
    color:var(--primary);
    font-size:10px;
    font-weight:800;
}

/* =========================
   MATCH SCORE
========================= */

.match-layout{
    display:flex;
    align-items:center;
    gap:25px;
}

.score-circle{
    width:145px;
    height:145px;
    flex:0 0 145px;
    border-radius:50%;
    background:conic-gradient(#2563eb 0 84%,#e2e8f0 84% 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.score-circle:after{
    content:"";
    position:absolute;
    width:112px;
    height:112px;
    background:white;
    border-radius:50%;
}

.score-content{
    position:relative;
    z-index:2;
    text-align:center;
}

.score-content strong{
    display:block;
    font-size:30px;
}

.score-content small{
    color:var(--muted);
    font-size:9px;
    font-weight:700;
}

.match-details{
    flex:1;
    min-width:0;
}

.match-details h3{
    font-size:15px;
    margin-bottom:6px;
}

.match-details p{
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
    margin-bottom:14px;
}

.breakdown{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.breakdown-row{
    display:grid;
    grid-template-columns:90px 1fr 40px;
    align-items:center;
    gap:8px;
    font-size:10px;
}

.progress{
    height:7px;
    background:#e2e8f0;
    border-radius:20px;
    overflow:hidden;
}

.progress span{
    display:block;
    height:100%;
    background:#2563eb;
    border-radius:20px;
}

.score-note{
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    background:#f8fafc;
    color:#64748b;
    font-size:9px;
    line-height:1.5;
}

/* =========================
   JOB CARDS
========================= */

.job-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.job-card{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    border:1px solid var(--border);
    border-radius:13px;
    transition:.2s;
}

.job-card:hover{
    border-color:#93c5fd;
    background:#f8fbff;
}

.company-logo{
    width:42px;
    height:42px;
    flex:0 0 42px;
    border-radius:11px;
    background:#eff6ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:#2563eb;
}

.job-info{
    flex:1;
    min-width:0;
}

.job-info h3{
    font-size:13px;
    margin-bottom:4px;
}

.job-info p{
    color:var(--muted);
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.match-badge{
    padding:6px 8px;
    border-radius:8px;
    background:#ecfdf5;
    color:#15803d;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.job-btn{
    border:0;
    background:#eff6ff;
    color:#2563eb;
    padding:7px 10px;
    border-radius:8px;
    font-size:10px;
    font-weight:700;
}

/* =========================
   SKILL GAP
========================= */

.skill-gap{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.skill-item{
    padding:13px;
    border-radius:12px;
    background:#f8fafc;
    border:1px solid #eef2f7;
}

.skill-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.skill-top strong{
    font-size:12px;
}

.skill-top span{
    font-size:9px;
    font-weight:800;
}

.skill-missing{
    color:#dc2626;
}

.skill-good{
    color:#16a34a;
}

.skill-item p{
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
}

/* =========================
   LEARNING
========================= */

.learning-card{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:13px;
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:10px;
}

.learning-icon{
    width:39px;
    height:39px;
    flex:0 0 39px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fef3c7;
}

.learning-card h3{
    font-size:12px;
    margin-bottom:4px;
}

.learning-card p{
    color:var(--muted);
    font-size:10px;
    line-height:1.4;
}

.learn-btn{
    margin-left:auto;
    border:0;
    background:#2563eb;
    color:white;
    padding:7px 10px;
    border-radius:8px;
    font-size:9px;
    font-weight:700;
}

/* =========================
   APPLICATIONS
========================= */

.application{
    padding:12px 0;
    border-bottom:1px solid #eef2f7;
}

.application:last-child{
    border-bottom:0;
}

.application-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.application h3{
    font-size:12px;
}

.application small{
    color:var(--muted);
    font-size:9px;
}

.status{
    padding:4px 7px;
    border-radius:7px;
    font-size:8px;
    font-weight:800;
    white-space:nowrap;
}

.status.review{
    background:#eff6ff;
    color:#2563eb;
}

.status.shortlisted{
    background:#ecfdf5;
    color:#15803d;
}

.status.interview{
    background:#fef3c7;
    color:#b45309;
}

/* =========================
   PROFILE COMPLETION
========================= */

.profile-progress{
    display:flex;
    align-items:center;
    gap:15px;
}

.profile-ring{
    width:75px;
    height:75px;
    border-radius:50%;
    background:conic-gradient(#2563eb 0 78%,#e2e8f0 78% 100%);
    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-ring div{
    width:58px;
    height:58px;
    background:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:800;
}

.profile-progress p{
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
}

.complete-btn{
    margin-top:10px;
    display:inline-block;
    text-decoration:none;
    color:#2563eb;
    font-size:10px;
    font-weight:800;
}

/* =========================
   INTERVIEW
========================= */

.interview-card{
    padding:15px;
    border-radius:13px;
    background:linear-gradient(135deg,#eff6ff,#f5f3ff);
    border:1px solid #dbeafe;
}

.interview-card small{
    color:#64748b;
    font-size:9px;
}

.interview-card h3{
    font-size:14px;
    margin:6px 0;
}

.interview-info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.interview-info div{
    background:white;
    border-radius:8px;
    padding:9px;
}

.interview-info span{
    display:block;
    color:#64748b;
    font-size:8px;
}

.interview-info strong{
    display:block;
    font-size:10px;
    margin-top:3px;
}

/* =========================
   AI BUTTON
========================= */

.ai-button{
    position:fixed;
    right:25px;
    bottom:25px;
    border:0;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    padding:12px 17px;
    border-radius:30px;
    box-shadow:0 10px 28px rgba(37,99,235,.3);
    font-weight:800;
    font-size:11px;
    z-index:900;
}

/* =========================
   AI MODAL
========================= */

.ai-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:2000;
}

.ai-overlay.show{
    display:flex;
}

.ai-box{
    width:430px;
    max-width:100%;
    background:white;
    border-radius:20px;
    padding:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.2);
}

.ai-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.ai-head h2{
    font-size:17px;
}

.ai-close{
    border:0;
    background:#f1f5f9;
    width:30px;
    height:30px;
    border-radius:8px;
}

.ai-message{
    padding:14px;
    background:#f8fafc;
    border-radius:12px;
    font-size:11px;
    color:#475569;
    line-height:1.6;
}

.ai-suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
}

.ai-suggestion{
    border:1px solid #dbeafe;
    background:#eff6ff;
    color:#2563eb;
    padding:7px 9px;
    border-radius:8px;
    font-size:9px;
}

/* =========================
   MOBILE BOTTOM NAV
========================= */

.bottom-nav{
    display:none;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1150px){

    .overview{
        grid-template-columns:repeat(2,1fr);
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:850px){

    .sidebar{
        width:220px;
    }

    .main{
        width:calc(100% - 220px);
        margin-left:220px;
        padding:22px;
    }

    .match-layout{
        align-items:flex-start;
    }
}

@media(max-width:700px){

    body{
        padding-bottom:70px;
    }

    .sidebar{
        display:none;
    }

    .main{
        width:100%;
        margin-left:0;
        padding:14px 14px 90px;
    }

    .mobile-header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        margin-bottom:17px;
    }

    .mobile-brand{
        display:flex;
        align-items:center;
        gap:9px;
    }

    .mobile-brand img{
        width:34px;
        height:34px;
        object-fit:contain;
    }

    .mobile-brand strong{
        font-size:16px;
        letter-spacing:.5px;
    }

    .mobile-actions{
        display:flex;
        gap:7px;
    }

    .mobile-icon{
        width:35px;
        height:35px;
        border:1px solid var(--border);
        background:white;
        border-radius:9px;
        font-size:15px;
    }

    .topbar{
        margin-bottom:17px;
    }

    .page-title h1{
        font-size:22px;
    }

    .page-title p{
        font-size:11px;
    }

    .profile-mini{
        display:none;
    }

    .top-actions{
        display:none;
    }

    .welcome-card{
        padding:22px 18px;
        border-radius:18px;
    }

    .welcome-card h2{
        font-size:23px;
    }

    .welcome-card p{
        font-size:11px;
    }

    .overview{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .overview-card{
        padding:14px;
        border-radius:13px;
    }

    .overview-card h3{
        font-size:20px;
    }

    .overview-card small{
        font-size:8px;
    }

    .overview-icon{
        width:35px;
        height:35px;
        font-size:16px;
    }

    .dashboard-grid{
        display:flex;
        flex-direction:column;
        gap:14px;
    }

    .left-column,
    .right-column{
        gap:14px;
    }

    .panel{
        padding:16px;
        border-radius:15px;
    }

    .match-layout{
        flex-direction:column;
        align-items:center;
    }

    .match-details{
        width:100%;
    }

    .score-circle{
        width:135px;
        height:135px;
        flex-basis:135px;
    }

    .score-circle:after{
        width:104px;
        height:104px;
    }

    .breakdown-row{
        grid-template-columns:75px 1fr 35px;
    }

    .job-card{
        align-items:flex-start;
        flex-wrap:wrap;
    }

    .job-info{
        width:calc(100% - 55px);
    }

    .job-btn{
        margin-left:54px;
    }

    .match-badge{
        margin-left:auto;
    }

    .learning-card{
        flex-wrap:wrap;
    }

    .learn-btn{
        margin-left:51px;
    }

    .ai-button{
        right:15px;
        bottom:82px;
        padding:11px 14px;
    }

    .bottom-nav{
        position:fixed;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        left:0;
        right:0;
        bottom:0;
        height:65px;
        background:white;
        border-top:1px solid var(--border);
        z-index:1000;
        box-shadow:0 -5px 20px rgba(15,23,42,.06);
    }

    .bottom-nav a{
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        gap:4px;
        color:#64748b;
        text-decoration:none;
        font-size:9px;
        font-weight:700;

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FAST-TRACK | Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;
            bottom: 0;

            width: 240px;

            background: white;

            border-right: 1px solid #e2e8f0;

            padding: 22px 15px;

            z-index: 100;
        }

        .sidebar-brand {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 5px 10px 25px;

            font-size: 19px;

            font-weight: 800;

            color: #2563eb;
        }

        .sidebar-brand img {

            width: 38px;
            height: 38px;

            object-fit: contain;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .nav-menu {

            display: flex;

            flex-direction: column;

            gap: 6px;
        }

        .nav-item {

            display: flex;

            align-items: center;

            gap: 12px;

            width: 100%;

            padding: 12px 13px;

            border: none;

            border-radius: 10px;

            background: transparent;

            color: #64748b;

            font-size: 13px;

            font-weight: 600;

            text-align: left;

            cursor: pointer;

            transition: 0.2s;
        }

        .nav-item:hover {

            background: #eff6ff;

            color: #2563eb;
        }

        .nav-item.active {

            background: #eff6ff;

            color: #2563eb;
        }

        .nav-icon {

            width: 22px;

            text-align: center;

            font-size: 17px;
        }

        /* =========================
           MAIN AREA
        ========================= */

        .main {

            margin-left: 240px;

            min-height: 100vh;
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: flex-end;

            padding: 0 30px;

            background: white;

            border-bottom: 1px solid #e2e8f0;
        }

        .user-area {

            display: flex;

            align-items: center;

            gap: 15px;
        }

        #userName {

            font-size: 13px;

            font-weight: 700;

            color: #334155;
        }

        #logoutButton {

            border: none;

            padding: 9px 16px;

            border-radius: 8px;

            background: #ef4444;

            color: white;

            font-size: 12px;

            font-weight: 600;

            cursor: pointer;
        }

        /* =========================
           CONTENT
        ========================= */

        .dashboard {

            padding: 35px;
        }

        .welcome {

            margin-bottom: 30px;
        }

        .welcome h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .welcome p {

            color: #64748b;

            font-size: 14px;
        }

        /* =========================
           CARDS
        ========================= */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }

        .card {

            background: white;

            padding: 25px;

            border-radius: 16px;

            border: 1px solid #e2e8f0;

            transition: 0.2s;

            cursor: pointer;
        }

        .card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(15,23,42,0.08);
        }

        .card-icon {

            font-size: 28px;

            margin-bottom: 15px;
        }

        .card h3 {

            font-size: 16px;

            margin-bottom: 7px;
        }

        .card p {

            color: #64748b;

            font-size: 12px;

            line-height: 1.5;
        }

        /* =========================
           MOBILE
        ========================= */

        .mobile-header {

            display: none;
        }

        @media (max-width: 800px) {

            .sidebar {

                width: 70px;

                padding: 18px 8px;
            }

            .sidebar-brand {

                justify-content: center;

                padding: 5px 0 25px;
            }

            .sidebar-brand span {

                display: none;
            }

            .nav-item {

                justify-content: center;

                padding: 12px 5px;
            }

            .nav-item span:not(.nav-icon) {

                display: none;
            }

            .nav-icon {

                font-size: 19px;
            }

            .main {

                margin-left: 70px;
            }

            .topbar {

                padding: 0 15px;
            }

            .dashboard {

                padding: 25px 15px;
            }

            .cards {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {

            .sidebar {

                position: fixed;

                top: auto;

                bottom: 0;

                left: 0;

                width: 100%;

                height: 65px;

                padding: 5px 4px;

                border-right: none;

                border-top: 1px solid #e2e8f0;
            }

            .sidebar-brand {

                display: none;
            }

            .nav-menu {

                height: 100%;

                flex-direction: row;

                justify-content:
                    space-around;

                align-items: center;

                gap: 0;
            }

            .nav-item {

                flex: 1;

                height: 55px;

                flex-direction: column;

                justify-content: center;

                gap: 2px;

                padding: 4px 2px;

                border-radius: 8px;

                font-size: 9px;
            }

            .nav-item span:not(.nav-icon) {

                display: block;
            }

            .nav-icon {

                font-size: 17px;
            }

            .main {

                margin-left: 0;

                padding-bottom: 70px;
            }

            .topbar {

                height: 60px;
            }

            #userName {

                display: none;
            }

            .dashboard {

                padding: 22px 14px;
            }

            .welcome h1 {

                font-size: 23px;
            }

            .welcome p {

                font-size: 12px;
            }

            .cards {

                grid-template-columns: 1fr;

                gap: 13px;
            }

            .card {

                padding: 20px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">

            <img
                src="fast-track-logo.png"
                alt="FAST-TRACK">

            <span>
                FAST-TRACK
            </span>

        </div>


        <nav class="nav-menu">

            <button
                class="nav-item active">

                <span class="nav-icon">
                    🏠
                </span>

                <span>
                    Dashboard
                </span>

            </button>


            <button
                class="nav-item">

                <span class="nav-icon">
                    💼
                </span>

                <span>
                    Jobs
                </span>

            </button>


            <button
                class="nav-item">

                <span class="nav-icon">
                    🧠
                </span>

                <span>
                    Skills
                </span>

            </button>


            <button
                class="nav-item">

                <span class="nav-icon">
                    📚
                </span>

                <span>
                    Courses
                </span>

            </button>


            <button
                class="nav-item">

                <span class="nav-icon">
                    📄
                </span>

                <span>
                    Resume
                </span>

            </button>


            <button
                class="nav-item">

                <span class="nav-icon">
                    📈
                </span>

                <span>
                    Progress
                </span>

            </button>


            <button
                class="nav-item">

                <span class="nav-icon">
                    👤
                </span>

                <span>
                    Profile
                </span>

            </button>

        </nav>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <!-- TOPBAR -->

        <header class="topbar">

            <div class="user-area">

                <span id="userName">
                    Loading...
                </span>

                <button id="logoutButton">
                    Logout
                </button>

            </div>

        </header>


        <!-- DASHBOARD -->

        <section class="dashboard">

            <div class="welcome">

                <h1>
                    Welcome,
                    <span id="welcomeName">
                        User
                    </span>
                    👋
                </h1>

                <p>
                    Your career journey starts here.
                </p>

            </div>


            <div class="cards">


                <div class="card">

                    <div class="card-icon">
                        💼
                    </div>

                    <h3>
                        Jobs
                    </h3>

                    <p>
                        Discover career
                        opportunities.
                    </p>

                </div>


                <div class="card">

                    <div class="card-icon">
                        🧠
                    </div>

                    <h3>
                        Skills
                    </h3>

                    <p>
                        Track and improve
                        your skills.
                    </p>

                </div>


                <div class="card">

                    <div class="card-icon">
                        📄
                    </div>

                    <h3>
                        Resume Builder
                    </h3>

                    <p>
                        Build your professional
                        resume.
                    </p>

                </div>


                <div class="card">

                    <div class="card-icon">
                        📈
                    </div>

                    <h3>
                        Career Progress
                    </h3>

                    <p>
                        Monitor your career
                        growth.
                    </p>

                </div>


            </div>

        </section>

    </main>


    <!-- =========================
         FIREBASE
    ========================= -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from
        "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyDJ84_tSgau334V60r17bqHHubaf5Lecto",

            authDomain:
                "fast-track-6d262.firebaseapp.com",

            projectId:
                "fast-track-6d262",

            storageBucket:
                "fast-track-6d262.firebasestorage.app",

            messagingSenderId:
                "338934873510",

            appId:
                "1:338934873510:web:1ad3791207107af183a367",

            measurementId:
                "G-M6FSRH2Y9H"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const userName =
            document.getElementById(
                "userName"
            );


        const welcomeName =
            document.getElementById(
                "welcomeName"
            );


        /* =========================
           USER
        ========================= */

        onAuthStateChanged(
            auth,
            (user) => {

                if (user) {

                    const name =
                        user.displayName ||
                        user.email.split("@")[0];

                    userName.textContent =
                        name;

                    welcomeName.textContent =
                        name;

                } else {

                    window.location.href =
                        "index.html";

                }

            }
        );


        /* =========================
           LOGOUT
        ========================= */

        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                async () => {

                    await signOut(auth);

                    window.location.href =
                        "index.html";

                }
            );


        /* =========================
           NAVIGATION ACTIVE
        ========================= */

        const navItems =
            document.querySelectorAll(
                ".nav-item"
            );


        navItems.forEach(item => {

            item.addEventListener(
                "click",
                () => {

                    navItems.forEach(
                        nav =>
                        nav.classList.remove(
                            "active"
                        )
                    );

                    item.classList.add(
                        "active"
                    );

                }
            );

        });

    </script>


</body>

</html>

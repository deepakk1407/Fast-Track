<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST-TRACK | Jobs</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #070b14;
            color: white;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 245px;
            padding: 24px 15px;
            background: rgba(10, 14, 25, 0.96);
            border-right: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 5px 10px 25px;
        }

        .sidebar-brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .brand-text {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        .nav-item.active {
            background: linear-gradient(
                135deg,
                rgba(37,99,235,0.95),
                rgba(124,58,237,0.95)
            );
            color: white;
            box-shadow: 0 8px 25px rgba(37,99,235,0.18);
        }

        .nav-icon {
            width: 23px;
            display: flex;
            justify-content: center;
            font-size: 17px;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 245px;
            padding: 25px 30px;
            min-height: 100vh;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            height: 65px;
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .mobile-brand {
            display: none;
            align-items: center;
            gap: 9px;
        }

        .mobile-brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .mobile-brand span {
            font-size: 18px;
            font-weight: 800;
        }

        .dashboard-btn {
            margin-left: auto;
            padding: 9px 14px;
            border-radius: 9px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #d1d5db;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
        }

        .dashboard-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* ================= HEADER ================= */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #8b93a5;
            font-size: 14px;
        }

        /* ================= SEARCH ================= */

        .search-area {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.08);
            background: #101725;
            color: white;
            outline: none;
            font-family: inherit;
            font-size: 12px;
        }

        .search-input::placeholder {
            color: #687184;
        }

        .search-input:focus {
            border-color: rgba(96,165,250,0.5);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }

        /* ================= JOB GRID ================= */

        .job-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 18px;
        }

        .job-card {
            padding: 22px;
            border-radius: 17px;
            background:
                linear-gradient(
                    145deg,
                    rgba(20,27,45,0.95),
                    rgba(12,17,29,0.95)
                );
            border: 1px solid rgba(255,255,255,0.07);
            transition: 0.25s;
        }

        .job-card:hover {
            transform: translateY(-4px);
            border-color: rgba(96,165,250,0.25);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .job-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .job-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: rgba(59,130,246,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
        }

        .save-btn {
            height: 34px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #9ca3af;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            transition: 0.2s;
        }

        .save-btn:hover {
            background: rgba(59,130,246,0.08);
            color: white;
        }

        .save-btn.saved {
            color: #93c5fd;
            border-color: rgba(59,130,246,0.35);
            background: rgba(59,130,246,0.1);
        }

        .job-card h2 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .company {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 15px;
        }

        .job-info {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 15px;
        }

        .tag {
            padding: 6px 9px;
            border-radius: 7px;
            background: rgba(255,255,255,0.05);
            color: #aeb6c5;
            font-size: 9px;
        }

        .salary {
            color: #86efac;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .apply-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            transition: 0.2s;
        }

        .apply-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .apply-btn.applied {
            background: rgba(34,197,94,0.13);
            color: #86efac;
            border: 1px solid rgba(34,197,94,0.25);
            cursor: default;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 16px;
            background: #101725;
            color: #8b93a5;
            font-size: 12px;
        }

        .no-results-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .no-results h3 {
            color: white;
            margin-bottom: 6px;
            font-size: 15px;
        }

        /* ================= MODAL ================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .job-modal {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: #101725;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-top {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 22px;
        }

        .modal-icon {
            width: 55px;
            height: 55px;
            flex-shrink: 0;
            border-radius: 14px;
            background: rgba(59,130,246,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .modal-title {
            flex: 1;
        }

        .modal-title h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .modal-title p {
            color: #9ca3af;
            font-size: 11px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
        }

        .close-btn:hover {
            color: white;
            background: rgba(255,255,255,0.08);
        }

        .modal-info {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-box {
            padding: 13px;
            border-radius: 10px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .info-label {
            color: #687184;
            font-size: 9px;
            margin-bottom: 5px;
        }

        .info-value {
            color: #e5e7eb;
            font-size: 11px;
            font-weight: 600;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            font-size: 12px;
            margin-bottom: 9px;
        }

        .modal-section p {
            color: #9ca3af;
            font-size: 11px;
            line-height: 1.7;
        }

        .skill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .skill-chip {
            padding: 7px 10px;
            border-radius: 7px;
            background: rgba(37,99,235,0.1);
            border: 1px solid rgba(37,99,235,0.15);
            color: #93c5fd;
            font-size: 9px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 9px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-btn {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #d1d5db;
        }

        .confirm-btn {
            border: none;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            color: white;
        }

        .confirm-btn:hover {
            opacity: 0.9;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #111827;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 12px;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: 0.3s;
            z-index: 3000;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ================= TABLET ================= */

        @media (max-width:800px) {

            .sidebar {
                width: 70px;
                padding: 20px 9px;
            }

            .sidebar-brand {
                justify-content: center;
                padding: 5px 0 25px;
            }

            .sidebar-brand img {
                width: 38px;
                height: 38px;
            }

            .brand-text {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 13px 8px;
            }

            .nav-item span:last-child {
                display: none;
            }

            .nav-icon {
                width: auto;
            }

            .main {
                margin-left: 70px;
            }

            .job-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width:500px) {

            body {
                padding-bottom: 72px;
            }

            .sidebar {
                position: fixed;
                left: 0;
                right: 0;
                top: auto;
                bottom: 0;
                width: 100%;
                height: 65px;
                padding: 7px 5px;
                border-right: none;
                border-top: 1px solid rgba(255,255,255,0.08);
                background: rgba(10,14,25,0.98);
                backdrop-filter: blur(15px);
                display: block;
            }

            .sidebar-brand {
                display: none;
            }

            .nav-menu {
                height: 100%;
                display: grid;
                grid-template-columns: repeat(7,1fr);
                gap: 2px;
                align-items: center;
            }

            .nav-item {
                height: 52px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 2px;
                padding: 4px 1px;
                border-radius: 9px;
                font-size: 8px;
            }

            .nav-item span:last-child {
                display: block;
                font-size: 8px;
            }

            .nav-icon {
                font-size: 18px;
                width: auto;
            }

            .main {
                margin-left: 0;
                padding: 18px 15px;
            }

            .topbar {
                height: 50px;
                margin-bottom: 20px;
            }

            .mobile-brand {
                display: flex;
            }

            .dashboard-btn {
                padding: 8px 10px;
                font-size: 10px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .page-header p {
                font-size: 12px;
                line-height: 1.5;
            }

            .search-area {
                grid-template-columns: 1fr;
            }

            .job-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .job-card {
                padding: 18px;
            }

            .modal-overlay {
                padding: 12px;
            }

            .job-modal {
                padding: 20px;
                border-radius: 17px;
            }

            .modal-info {
                grid-template-columns: 1fr;
            }

            .toast {
                left: 15px;
                right: 15px;
                bottom: 80px;
                text-align: center;
            }
        }
    </style>
</head>

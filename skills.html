<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAST-TRACK | Skills</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #070b14;
            color: #fff;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 245px;
            padding: 24px 15px;
            background: rgba(10, 14, 25, 0.96);
            border-right: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 5px 10px 25px;
        }

        .sidebar-brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .brand-text {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .nav-item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 13px 14px;

            border: none;
            border-radius: 11px;

            background: transparent;
            color: #9ca3af;

            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            text-align: left;

            transition: 0.2s ease;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: white;
        }

        .nav-item.active {
            background: linear-gradient(
                135deg,
                rgba(37,99,235,0.95),
                rgba(124,58,237,0.95)
            );

            color: white;

            box-shadow:
                0 8px 25px rgba(37,99,235,0.18);
        }

        .nav-icon {
            width: 23px;
            display: flex;
            justify-content: center;
            font-size: 17px;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 245px;
            min-height: 100vh;
            padding: 25px 30px;
        }

        /* ================= TOPBAR ================= */

        .topbar {
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 25px;
        }

        .mobile-brand {
            display: none;
            align-items: center;
            gap: 9px;
        }

        .mobile-brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .mobile-brand span {
            font-size: 18px;
            font-weight: 800;
        }

        .dashboard-btn {
            margin-left: auto;

            padding: 9px 14px;

            border-radius: 9px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(255,255,255,0.05);

            color: #d1d5db;

            cursor: pointer;

            font-family: inherit;
            font-size: 12px;
            font-weight: 600;

            transition: 0.2s;
        }

        .dashboard-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* ================= HEADER ================= */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;

            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #8b93a5;
            font-size: 14px;
        }

        .add-btn {
            padding: 12px 18px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            color: white;

            cursor: pointer;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            white-space: nowrap;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* ================= SCORE ================= */

        .score-card {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 25px;

            margin-bottom: 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,27,45,0.95),
                    rgba(12,17,29,0.95)
                );

            border: 1px solid rgba(255,255,255,0.07);
        }

        .score-left h2 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .score-left p {
            color: #8b93a5;
            font-size: 12px;
        }

        .score {
            font-size: 32px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ================= OVERVIEW ================= */

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .overview {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;

            margin-bottom: 25px;
        }

        .overview-card {
            padding: 20px;

            border-radius: 15px;

            background: #101725;

            border: 1px solid rgba(255,255,255,0.07);
        }

        .overview-card span {
            color: #8b93a5;
            font-size: 11px;
        }

        .overview-card h3 {
            font-size: 25px;
            margin-top: 8px;
        }

        /* ================= SKILLS ================= */

        .skills-section {
            margin-bottom: 25px;
        }

        .skills-list {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 14px;
        }

        .skill-card {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px;

            border-radius: 14px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,27,45,0.95),
                    rgba(12,17,29,0.95)
                );

            border: 1px solid rgba(255,255,255,0.07);
        }

        .skill-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .skill-level {
            color: #8b93a5;
            font-size: 10px;
        }

        .remove-btn {
            padding: 8px 11px;

            border-radius: 8px;

            border: 1px solid rgba(239,68,68,0.25);

            background: rgba(239,68,68,0.08);

            color: #fca5a5;

            cursor: pointer;

            font-family: inherit;
            font-size: 10px;
        }

        .remove-btn:hover {
            background: rgba(239,68,68,0.15);
        }

        /* ================= EMPTY ================= */

        .empty-skills {
            grid-column: 1 / -1;

            text-align: center;

            padding: 45px 20px;

            border-radius: 16px;

            background: #101725;

            border: 1px dashed rgba(255,255,255,0.12);
        }

        .empty-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .empty-skills h3 {
            font-size: 16px;
            margin-bottom: 7px;
        }

        .empty-skills p {
            color: #8b93a5;
            font-size: 11px;
        }

        /* ================= RECOMMENDED ================= */

        .recommended {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
        }

        .recommend-card {
            padding: 18px;

            border-radius: 14px;

            background: #101725;

            border: 1px solid rgba(255,255,255,0.07);
        }

        .recommend-card h3 {
            font-size: 14px;
            margin-bottom: 7px;
        }

        .recommend-card p {
            color: #8b93a5;
            font-size: 10px;
            line-height: 1.5;
        }

        /* ================= MODAL ================= */

        .modal {
            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,0.7);

            backdrop-filter: blur(5px);

            z-index: 3000;

            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 420px;

            padding: 25px;

            border-radius: 18px;

            background: #111827;

            border: 1px solid rgba(255,255,255,0.1);

            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .modal-box h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .modal-box > p {
            color: #8b93a5;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            color: #cbd5e1;

            font-size: 11px;
            font-weight: 600;

            margin-bottom: 7px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px;

            border-radius: 9px;

            border: 1px solid rgba(255,255,255,0.1);

            outline: none;

            background: #0b1220;

            color: white;

            font-family: inherit;
            font-size: 12px;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #3b82f6;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-btn,
        .save-btn {
            flex: 1;

            padding: 11px;

            border-radius: 9px;

            cursor: pointer;

            font-family: inherit;

            font-size: 11px;
            font-weight: 700;
        }

        .cancel-btn {
            background: transparent;

            border: 1px solid rgba(255,255,255,0.1);

            color: #9ca3af;
        }

        .save-btn {
            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            border: none;

            color: white;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;

            right: 25px;
            bottom: 25px;

            background: #111827;

            border: 1px solid rgba(255,255,255,0.1);

            color: white;

            padding: 13px 18px;

            border-radius: 10px;

            font-size: 12px;

            opacity: 0;

            transform: translateY(20px);

            pointer-events: none;

            transition: 0.3s;

            z-index: 4000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* ================= TABLET ================= */

        @media (max-width:800px) {

            .sidebar {
                width: 70px;
                padding: 20px 9px;
            }

            .sidebar-brand {
                justify-content: center;
                padding: 5px 0 25px;
            }

            .sidebar-brand img {
                width: 38px;
                height: 38px;
            }

            .brand-text {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 13px 8px;
            }

            .nav-item span:last-child {
                display: none;
            }

            .nav-icon {
                width: auto;
            }

            .main {
                margin-left: 70px;
            }

            .skills-list {
                grid-template-columns: 1fr;
            }
        }

        /* ================= MOBILE ================= */

        @media (max-width:500px) {

            body {
                padding-bottom: 72px;
            }

            .sidebar {
                position: fixed;

                left: 0;
                right: 0;
                top: auto;
                bottom: 0;

                width: 100%;
                height: 65px;

                padding: 7px 5px;

                border-right: none;

                border-top: 1px solid rgba(255,255,255,0.08);

                background: rgba(10,14,25,0.98);

                backdrop-filter: blur(15px);

                display: block;
            }

            .sidebar-brand {
                display: none;
            }

            .nav-menu {
                height: 100%;

                display: grid;

                grid-template-columns: repeat(7,1fr);

                gap: 2px;

                align-items: center;
            }

            .nav-item {
                height: 52px;

                display: flex;

                flex-direction: column;

                justify-content: center;
                align-items: center;

                gap: 2px;

                padding: 4px 1px;

                border-radius: 9px;

                font-size: 8px;
            }

            .nav-item span:last-child {
                display: block;
                font-size: 8px;
            }

            .nav-icon {
                font-size: 18px;
                width: auto;
            }

            .main {
                margin-left: 0;
                padding: 18px 15px;
            }

            .topbar {
                height: 50px;
                margin-bottom: 20px;
            }

            .mobile-brand {
                display: flex;
            }

            .dashboard-btn {
                padding: 8px 10px;
                font-size: 10px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .page-header p {
                font-size: 12px;
            }

            .add-btn {
                width: 100%;
            }

            .score-card {
                padding: 20px;
            }

            .score {
                font-size: 27px;
            }

            .overview {
                grid-template-columns: 1fr;
            }

            .recommended {
                grid-template-columns: 1fr;
            }

            .skill-card {
                padding: 15px;
            }

            .toast {
                left: 15px;
                right: 15px;
                bottom: 80px;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="sidebar-brand">
            <img src="fast-track-logo.png" alt="FAST-TRACK Logo">
            <div class="brand-text">FAST-TRACK</div>
        </div>

        <nav class="nav-menu">

            <button class="nav-item"
                onclick="window.location.href='dashboard.html'">
                <span class="nav-icon">🏠</span>
                <span>Dashboard</span>
            </button>

            <button class="nav-item"
                onclick="window.location.href='jobs.html'">
                <span class="nav-icon">💼</span>
                <span>Jobs</span>
            </button>

            <button class="nav-item active"
                onclick="window.location.href='skills.html'">
                <span class="nav-icon">🧠</span>
                <span>Skills</span>
            </button>

            <button class="nav-item"
                onclick="window.location.href='courses.html'">
                <span class="nav-icon">📚</span>
                <span>Courses</span>
            </button>

            <button class="nav-item"
                onclick="window.location.href='resume.html'">
                <span class="nav-icon">📄</span>
                <span>Resume</span>
            </button>

            <button class="nav-item"
                onclick="window.location.href='progress.html'">
                <span class="nav-icon">📈</span>
                <span>Progress</span>
            </button>

            <button class="nav-item"
                onclick="window.location.href='profile.html'">
                <span class="nav-icon">👤</span>
                <span>My Profile</span>
            </button>

        </nav>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <header class="topbar">

            <div class="mobile-brand">

                <img
                    src="fast-track-logo.png"
                    alt="FAST-TRACK Logo">

                <span>FAST-TRACK</span>

            </div>

            <button
                class="dashboard-btn"
                onclick="window.location.href='dashboard.html'">

                ← Dashboard

            </button>

        </header>


        <!-- HEADER -->

        <section class="page-header">

            <div>

                <h1>
                    Build Your Skills 🚀
                </h1>

                <p>
                    Add your skills and build a stronger career profile.
                </p>

            </div>

            <button
                class="add-btn"
                onclick="openModal()">

                + Add Skill

            </button>

        </section>


        <!-- SCORE -->

        <section class="score-card">

            <div class="score-left">

                <h2>
                    Overall Skill Score
                </h2>

                <p>
                    Your score will improve as you build your skill profile.
                </p>

            </div>

            <div
                class="score"
                id="overallScore">

                0%

            </div>

        </section>


        <!-- OVERVIEW -->

        <h2 class="section-title">
            Skill Overview
        </h2>

        <section class="overview">

            <div class="overview-card">

                <span>
                    Skills Added
                </span>

                <h3 id="skillCount">
                    0
                </h3>

            </div>

            <div class="overview-card">

                <span>
                    Intermediate
                </span>

                <h3 id="intermediateCount">
                    0
                </h3>

            </div>

            <div class="overview-card">

                <span>
                    Advanced
                </span>

                <h3 id="advancedCount">

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST-TRACK | Register</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #eef5ff, #f8fbff);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 24px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
}

.logo {
    text-align: center;
    margin-bottom: 18px;
}

.logo img {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.logo h1 {
    margin-top: 8px;
    color: #172554;
    font-size: 25px;
    letter-spacing: 1px;
}

.logo p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    color: #0f172a;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 22px;
}

.input-group {
    margin-bottom: 16px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #dbe3ef;
    border-radius: 11px;
    outline: none;
    font-size: 14px;
    transition: 0.2s;
}

.input-group input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 55px;
}

.show-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
}

.register-btn {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 11px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 5px;
}

.register-btn:hover {
    opacity: 0.92;
}

.message {
    display: none;
    margin-top: 14px;
    padding: 11px;
    border-radius: 9px;
    font-size: 13px;
    text-align: center;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #64748b;
}

.login-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 700;
}

@media (max-width: 480px) {
    .container {
        padding: 28px 22px;
        border-radius: 20px;
    }

    .logo img {
        width: 55px;
        height: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="fast-track-logo.png" alt="FAST-TRACK Logo">
        <h1>FAST-TRACK</h1>
        <p>Understand your fit. Improve your skills.</p>
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Start your career journey with FAST-TRACK.</p>

    <form id="registerForm">

        <div class="input-group">
            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="input-group">
            <label>Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password')">
                    👁️
                </button>
            </div>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirmPassword')">
                    👁️
                </button>
            </div>
        </div>

        <button type="submit" class="register-btn">
            Create Account →
        </button>

        <div id="message" class="message"></div>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

function togglePassword(id) {

    const input = document.getElementById(id);

    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}


document.getElementById("registerForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    const message = document.getElementById("message");


    if (password !== confirmPassword) {

        message.style.display = "block";
        message.style.background = "#fee2e2";
        message.style.color = "#b91c1c";
        message.textContent = "Passwords do not match.";

        return;
    }


    if (password.length < 6) {

        message.style.display = "block";
        message.style.background = "#fee2e2";
        message.style.color = "#b91c1c";
        message.textContent = "Password must contain at least 6 characters.";

        return;
    }


    const existingUser = JSON.parse(
        localStorage.getItem("fastTrackUser")
    );


    if (existingUser && existingUser.email === email) {

        message.style.display = "block";
        message.style.background = "#fee2e2";
        message.style.color = "#b91c1c";
        message.textContent = "An account with this email already exists.";

        return;
    }


    /*
       IMPORTANT:
       New user starts with ZERO profile data.
       No fake AI score.
    */

    const user = {

        name: name,

        email: email,

        password: password,

        skills: [],

        projects: [],

        certifications: [],

        education: "",

        cvUploaded: false,

        matchScore: 0,

        applications: [],

        profileCompleted: false

    };


    localStorage.setItem(
        "fastTrackUser",
        JSON.stringify(user)
    );


    message.style.display = "block";
    message.style.background = "#dcfce7";
    message.style.color = "#166534";
    message.textContent = "Account created successfully!";


    setTimeout(function() {

        window.location.href = "login.html";

    }, 1000);

});

</script>

</body>
</html>

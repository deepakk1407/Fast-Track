<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST-TRACK | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #eef5ff, #f8fbff);
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 24px;
    padding: 38px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo img {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.logo h1 {
    margin-top: 8px;
    color: #172554;
    font-size: 25px;
    letter-spacing: 1px;
}

.logo p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    color: #0f172a;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 22px;
}

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe3ef;
    border-radius: 11px;
    outline: none;
    font-size: 14px;
}

.input-group input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 50px;
}

.show-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.login-btn:hover {
    opacity: 0.92;
}

.google-btn {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: 1px solid #dbe3ef;
    border-radius: 11px;
    background: white;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.google-btn:hover {
    background: #f8fafc;
}

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
    color: #94a3b8;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #e2e8f0;
    flex: 1;
}

.message {
    display: none;
    margin-top: 14px;
    padding: 11px;
    border-radius: 9px;
    font-size: 13px;
    text-align: center;
}

.register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #64748b;
}

.register-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 700;
}

@media (max-width: 480px) {

    .container {
        padding: 30px 22px;
        border-radius: 20px;
    }

    .logo img {
        width: 55px;
        height: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">

        <img
            src="fast-track-logo.png"
            alt="FAST-TRACK Logo"
        >

        <h1>FAST-TRACK</h1>

        <p>
            Understand your fit. Improve your skills.
        </p>

    </div>


    <h2>Welcome Back 👋</h2>

    <p class="subtitle">
        Login to continue your career journey.
    </p>


    <form id="loginForm">

        <div class="input-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="input-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()">
                    👁️
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn">

            Login →

        </button>


        <div class="divider">
            OR
        </div>


        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()">

            🔵 Continue with Google

        </button>


        <div
            id="message"
            class="message">
        </div>

    </form>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>


<script>

function togglePassword() {

    const input =
        document.getElementById("password");

    if (input.type === "password") {

        input.type = "text";

    } else {

        input.type = "password";

    }

}


document
.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    const user =
        JSON.parse(
            localStorage.getItem("fastTrackUser")
        );


    if (!user) {

        message.style.display = "block";

        message.style.background = "#fee2e2";

        message.style.color = "#b91c1c";

        message.textContent =
            "No account found. Please register first.";

        return;
    }


    if (
        user.email !== email ||
        user.password !== password
    ) {

        message.style.display = "block";

        message.style.background = "#fee2e2";

        message.style.color = "#b91c1c";

        message.textContent =
            "Incorrect email or password.";

        return;
    }


    /*
       Save login session
    */

    localStorage.setItem(
        "fastTrackLoggedIn",
        "true"
    );


    localStorage.setItem(
        "fastTrackCurrentUser",
        user.name
    );


    message.style.display = "block";

    message.style.background = "#dcfce7";

    message.style.color = "#166534";

    message.textContent =
        "Login successful!";


    setTimeout(function() {

        window.location.href =
            "dashboard.html";

    }, 700);

});


function googleLogin() {

    alert(
        "Google Login will be connected using Firebase Authentication in the next step."
    );

}

</script>

</body>
</html>

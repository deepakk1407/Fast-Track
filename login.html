<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FAST-TRACK | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #eef5ff, #f8fbff);
    padding: 20px;
}

/* LOGIN CARD */

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 24px;
    padding: 38px;
    box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo img {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.logo h1 {
    margin-top: 8px;
    color: #172554;
    font-size: 25px;
    letter-spacing: 1px;
}

.logo p {
    color: #64748b;
    font-size: 13px;
    margin-top: 5px;
}

h2 {
    color: #0f172a;
    font-size: 22px;
    margin-bottom: 5px;
}

.subtitle {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 22px;
}

/* INPUT */

.input-group {
    margin-bottom: 17px;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #334155;
    margin-bottom: 7px;
}

.input-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe3ef;
    border-radius: 11px;
    outline: none;
    font-size: 14px;
    transition: 0.2s;
}

.input-group input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
}

/* PASSWORD */

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 50px;
}

.show-password {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
}

/* LOGIN BUTTON */

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
}

/* GOOGLE */

.google-btn {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: 1px solid #dbe3ef;
    border-radius: 11px;
    background: white;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.google-btn:hover {
    background: #f8fafc;
}

/* DIVIDER */

.divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
    color: #94a3b8;
    font-size: 12px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    background: #e2e8f0;
    flex: 1;
}

/* ERROR MESSAGE */

.message {
    display: none;
    margin-top: 14px;
    padding: 11px;
    border-radius: 9px;
    font-size: 13px;
    text-align: center;
}

/* REGISTER */

.register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #64748b;
}

.register-link a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 700;
}


/* ================================================= */
/* PROFESSIONAL LOGIN SUCCESS POPUP */
/* ================================================= */

.success-overlay {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: rgba(15, 23, 42, 0.58);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    opacity: 0;
    visibility: hidden;

    transition: all 0.35s ease;

    z-index: 9999;
}

.success-overlay.show {
    opacity: 1;
    visibility: visible;
}


/* POPUP CARD */

.success-card {
    width: 90%;
    max-width: 390px;

    background: rgba(255, 255, 255, 0.98);

    border-radius: 25px;

    padding: 35px 28px 30px;

    text-align: center;

    box-shadow:
        0 30px 80px rgba(15, 23, 42, 0.28);

    transform: scale(0.75) translateY(25px);

    transition:
        transform 0.45s cubic-bezier(.17,.67,.32,1.3);
}

.success-overlay.show .success-card {
    transform: scale(1) translateY(0);
}


/* SUCCESS ICON */

.success-icon {
    width: 78px;
    height: 78px;

    margin: 0 auto 20px;

    border-radius: 50%;

    background: #ecfdf5;

    display: flex;
    align-items: center;
    justify-content: center;

    animation: iconBackground 0.5s ease;
}

.checkmark {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #10b981;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    box-shadow:
        0 8px 25px rgba(16, 185, 129, 0.35);

    animation: checkPop 0.55s ease;
}

@keyframes checkPop {

    0% {
        transform: scale(0) rotate(-30deg);
        opacity: 0;
    }

    70% {
        transform: scale(1.15) rotate(5deg);
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes iconBackground {

    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* POPUP TEXT */

.success-card h2 {
    color: #0f172a;
    font-size: 24px;
    margin-bottom: 8px;
}

.success-card p {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.5;
}

.success-card strong {
    color: #2563eb;
}


/* REDIRECT TEXT */

.redirect-text {
    display: block;

    color: #94a3b8;

    font-size: 12px;

    margin-bottom: 10px;
}


/* LOADING BAR */

.loading-bar {
    width: 100%;
    height: 5px;

    background: #e2e8f0;

    border-radius: 20px;

    overflow: hidden;
}

.loading-progress {
    width: 0%;
    height: 100%;

    background: linear-gradient(
        90deg,
        #2563eb,
        #10b981
    );

    border-radius: 20px;

    animation: loading 1.2s linear forwards;
}

@keyframes loading {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}


/* MOBILE */

@media (max-width: 480px) {

    .container {
        padding: 30px 22px;
        border-radius: 20px;
    }

    .logo img {
        width: 55px;
        height: 55px;
    }

    .success-card {
        max-width: 350px;
        padding: 30px 22px 26px;
        border-radius: 22px;
    }

    .success-icon {
        width: 70px;
        height: 70px;
    }

    .checkmark {
        width: 54px;
        height: 54px;
        font-size: 29px;
    }

    .success-card h2 {
        font-size: 22px;
    }
}
</style>
</head>


<body>


<!-- ================= LOGIN CARD ================= -->

<div class="container">

    <div class="logo">

        <img
            src="fast-track-logo.png"
            alt="FAST-TRACK Logo"
        >

        <h1>FAST-TRACK</h1>

        <p>
            Understand your fit. Improve your skills.
        </p>

    </div>


    <h2>Welcome Back 👋</h2>

    <p class="subtitle">
        Login to continue your career journey.
    </p>


    <form id="loginForm">


        <!-- EMAIL -->

        <div class="input-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label>Password</label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()">

                    👁️

                </button>

            </div>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            class="login-btn">

            Login →

        </button>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            class="google-btn"
            onclick="googleLogin()">

            🔵 Continue with Google

        </button>


        <!-- ERROR -->

        <div
            id="message"
            class="message">
        </div>


    </form>


    <!-- REGISTER LINK -->

    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>



<!-- ================================================= -->
<!-- PROFESSIONAL SUCCESS POPUP -->
<!-- ================================================= -->

<div id="successPopup" class="success-overlay">

    <div class="success-card">

        <div class="success-icon">

            <div class="checkmark">
                ✓
            </div>

        </div>


        <h2>
            Welcome Back!
        </h2>


        <p>
            Login successful,
            <strong id="popupName">User</strong>.
        </p>


        <span class="redirect-text">
            Redirecting to your dashboard...
        </span>


        <div class="loading-bar">

            <div class="loading-progress"></div>

        </div>

    </div>

</div>



<script>


/* ========================================= */
/* SHOW / HIDE PASSWORD */
/* ========================================= */

function togglePassword() {

    const input =
        document.getElementById("password");


    if (input.type === "password") {

        input.type = "text";

    } else {

        input.type = "password";

    }

}



/* ========================================= */
/* LOGIN */
/* ========================================= */

document
.getElementById("loginForm")
.addEventListener("submit", function(e) {

    e.preventDefault();


    const email =
        document.getElementById("email")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const message =
        document.getElementById("message");


    /* GET REGISTERED USER */

    const user =
        JSON.parse(
            localStorage.getItem("fastTrackUser")
        );


    /* NO USER */

    if (!user) {

        message.style.display = "block";

        message.style.background = "#fee2e2";

        message.style.color = "#b91c1c";

        message.textContent =
            "No account found. Please register first.";

        return;
    }


    /* WRONG LOGIN */

    if (
        user.email !== email ||
        user.password !== password
    ) {

        message.style.display = "block";

        message.style.background = "#fee2e2";

        message.style.color = "#b91c1c";

        message.textContent =
            "Incorrect email or password.";

        return;
    }


    /* ========================================= */
    /* LOGIN SUCCESS */
    /* ========================================= */


    /* SAVE LOGIN SESSION */

    localStorage.setItem(
        "fastTrackLoggedIn",
        "true"
    );


    localStorage.setItem(
        "fastTrackCurrentUser",
        user.name
    );


    /* PUT USER NAME IN POPUP */

    document.getElementById(
        "popupName"
    ).textContent = user.name;


    /* SHOW SUCCESS POPUP */

    document
        .getElementById("successPopup")
        .classList.add("show");


    /* REDIRECT */

    setTimeout(function() {

        window.location.href =
            "dashboard.html";

    }, 1200);

});



/* ========================================= */
/* GOOGLE LOGIN */
/* ========================================= */

function googleLogin() {

    alert(
        "Google Login will be connected using Firebase Authentication in the next step."
    );

}

</script>

</body>
</html>
